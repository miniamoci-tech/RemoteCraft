[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/relay",
    "crates/net",
    "crates/capture",
    "crates/input",
    "crates/files",
    "crates/audio",
    "crates/app",
    "crates/probe",
]

[workspace.package]
version = "0.1.10"
edition = "2021"
license = "MIT"
repository = "https://github.com/miniamoci-tech/RemoteCraft"

# `unsafe` is denied everywhere and allowed only in one small, audited module
# (crates/app/src/winos.rs) that calls the Win32 API to restore the host window
# from the system tray — eframe cannot repaint a hidden window, so it cannot
# bring it back on its own. "deny" (not "forbid") so that one module can opt in
# with #![allow(unsafe_code)]; everywhere else unsafe is still a hard error.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
snow = "0.9.6"
sha2 = "0.10.9"
rand = "0.8.5"
xcap = "0.9.8"
image = { version = "0.25.5", default-features = false, features = ["jpeg"] }
enigo = "0.2.1"
cpal = "0.15.3"
wasapi = "0.15.0"
