[package]
name = "remotecraft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "remotecraft"
path = "src/main.rs"

[dependencies]
remotecraft-core = { path = "../core" }
remotecraft-net = { path = "../net" }
remotecraft-capture = { path = "../capture" }
remotecraft-input = { path = "../input" }
remotecraft-files = { path = "../files" }
remotecraft-audio = { path = "../audio" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bincode = { workspace = true }
image = { workspace = true }
eframe = "0.29.1"
egui = "0.29.1"

# Windows-only: system-tray icon so the host window can minimize/close to the
# notification area instead of the taskbar. Kept off other platforms so the
# macOS build pulls no extra system dependencies.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
