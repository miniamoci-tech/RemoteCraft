[package]
name = "remotecraft-input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
remotecraft-core = { path = "../core" }
enigo = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Windows-only: SetCursorPos places the pointer anywhere on the virtual
# desktop (any monitor); enigo's absolute move only addresses the primary.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
